<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">일반 도구 호출과 PTC(Code Mode) 비교</title>
  <desc id="desc">일반 방식은 도구를 호출할 때마다 모델과 왕복하지만, PTC는 모델이 여러 단계를 묶은 프로그램 하나를 작성하고 호스트가 실행한 뒤 결과를 한 번 돌려준다.</desc>
  <rect width="1200" height="480" fill="#ffffff"/>
  <style>
    .label{font:700 23px sans-serif;fill:#171717}
    .text{font:19px sans-serif;fill:#303846}
    .small{font:16px sans-serif;fill:#667085}
    .cnt{font:700 17px sans-serif;fill:#c0504d}
    .cntg{font:700 17px sans-serif;fill:#4a9b67}
    .box{fill:#f6f8fc;stroke:#d8dee9;stroke-width:2}
    .blue{fill:#eaf1ff;stroke:#2f6fed;stroke-width:2}
    .green{fill:#ecf8f0;stroke:#4a9b67;stroke-width:2}
    .arrow{stroke:#8b97a8;stroke-width:2.5;fill:none;marker-end:url(#a)}
    .arrowr{stroke:#c0504d;stroke-width:2.5;fill:none;marker-end:url(#ar)}
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b97a8"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c0504d"/></marker>
  </defs>

  <text x="50" y="48" class="label">일반 도구 호출 — 단계마다 모델과 왕복</text>
  <rect x="50" y="76" width="150" height="80" rx="12" class="blue"/>
  <text x="125" y="112" text-anchor="middle" class="text">모델</text>
  <text x="125" y="138" text-anchor="middle" class="small">다음 호출 결정</text>

  <path d="M200 100 H330" class="arrowr"/>
  <text x="265" y="92" text-anchor="middle" class="small">호출 1</text>
  <path d="M330 132 H200" class="arrowr"/>
  <text x="265" y="152" text-anchor="middle" class="small">결과 1</text>

  <rect x="330" y="76" width="150" height="80" rx="12" class="box"/>
  <text x="405" y="122" text-anchor="middle" class="text">도구 실행</text>

  <path d="M480 100 H610" class="arrowr"/>
  <text x="545" y="92" text-anchor="middle" class="small">호출 2</text>
  <path d="M610 132 H480" class="arrowr"/>
  <text x="545" y="152" text-anchor="middle" class="small">결과 2</text>

  <rect x="610" y="76" width="150" height="80" rx="12" class="box"/>
  <text x="685" y="122" text-anchor="middle" class="text">도구 실행</text>

  <path d="M760 116 H860" class="arrowr"/>
  <text x="900" y="122" class="text">…</text>

  <rect x="950" y="76" width="200" height="80" rx="12" class="box"/>
  <text x="1050" y="112" text-anchor="middle" class="cnt">왕복 N회</text>
  <text x="1050" y="138" text-anchor="middle" class="small">단계마다 비용 발생</text>

  <path d="M50 196 H1150" stroke="#e4e8ef" stroke-width="2"/>

  <text x="50" y="248" class="label">PTC(Code Mode) — 프로그램 하나로 묶어 실행</text>
  <rect x="50" y="276" width="190" height="96" rx="12" class="blue"/>
  <text x="145" y="312" text-anchor="middle" class="text">모델</text>
  <text x="145" y="340" text-anchor="middle" class="small">TypeScript 프로그램</text>
  <text x="145" y="362" text-anchor="middle" class="small">한 번에 작성</text>

  <path d="M240 324 H350" class="arrow"/>
  <text x="295" y="312" text-anchor="middle" class="small">1회 전달</text>

  <rect x="350" y="268" width="420" height="112" rx="12" class="green"/>
  <text x="560" y="302" text-anchor="middle" class="text">호스트가 프로그램 실행</text>
  <text x="560" y="332" text-anchor="middle" class="small">비동기 함수 본문 · REPL · VM Script</text>
  <text x="560" y="358" text-anchor="middle" class="small">파일 정책 아래에서 여러 단계를 연속 처리</text>

  <path d="M770 324 H880" class="arrow"/>
  <text x="825" y="312" text-anchor="middle" class="small">결과 1회</text>

  <rect x="880" y="276" width="270" height="96" rx="12" class="green"/>
  <text x="1015" y="312" text-anchor="middle" class="cntg">왕복 1회</text>
  <text x="1015" y="340" text-anchor="middle" class="small">실험적으로 파이썬</text>
  <text x="1015" y="362" text-anchor="middle" class="small">백엔드도 지원</text>

  <text x="50" y="430" class="small">실패는 예외로 끊지 않고 결과로 돌려주어, 호출자가 진단하거나 모델에 다시 제시할 수 있다</text>
</svg>
