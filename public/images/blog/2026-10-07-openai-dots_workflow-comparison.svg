<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">기존 ChatGPT 대화와 dots의 동작 방식 비교</title>
  <desc id="desc">기존 ChatGPT는 프롬프트에 응답한 뒤 대화가 끝나면 작업도 멈추지만, dots는 목표를 위임받아 백그라운드에서 실행과 관찰을 반복하며 필요할 때만 승인을 요청한다.</desc>
  <rect width="1200" height="440" fill="#ffffff"/>
  <style>
    .label{font:700 25px sans-serif;fill:#171717}
    .text{font:20px sans-serif;fill:#303846}
    .small{font:17px sans-serif;fill:#667085}
    .loop{font:16px sans-serif;fill:#4a9b67}
    .box{fill:#f6f8fc;stroke:#d8dee9;stroke-width:2}
    .blue{fill:#eaf1ff;stroke:#2f6fed;stroke-width:2}
    .green{fill:#ecf8f0;stroke:#4a9b67;stroke-width:2}
    .amber{fill:#fdf4e7;stroke:#d79a3c;stroke-width:2}
    .arrow{stroke:#8b97a8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .arrowg{stroke:#4a9b67;stroke-width:3;fill:none;marker-end:url(#arrowg)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b97a8"/></marker>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a9b67"/></marker>
  </defs>

  <text x="60" y="52" class="label">기존 ChatGPT 대화</text>
  <rect x="60" y="80" width="250" height="88" rx="12" class="box"/>
  <text x="185" y="116" text-anchor="middle" class="text">프롬프트 입력</text>
  <text x="185" y="144" text-anchor="middle" class="small">사용자가 매번 요청</text>
  <path d="M310 124 H395" class="arrow"/>
  <rect x="395" y="80" width="250" height="88" rx="12" class="blue"/>
  <text x="520" y="116" text-anchor="middle" class="text">응답 생성</text>
  <text x="520" y="144" text-anchor="middle" class="small">한 번의 작업으로 종료</text>
  <path d="M645 124 H730" class="arrow"/>
  <rect x="730" y="80" width="250" height="88" rx="12" class="box"/>
  <text x="855" y="116" text-anchor="middle" class="text">대화 종료</text>
  <text x="855" y="144" text-anchor="middle" class="small">맥락과 진행 상황 소멸</text>

  <text x="60" y="252" class="label">dots</text>
  <rect x="60" y="280" width="250" height="88" rx="12" class="box"/>
  <text x="185" y="316" text-anchor="middle" class="text">책임 위임</text>
  <text x="185" y="344" text-anchor="middle" class="small">지속적인 목표를 전달</text>
  <path d="M310 324 H395" class="arrow"/>
  <rect x="395" y="280" width="250" height="88" rx="12" class="green"/>
  <text x="520" y="316" text-anchor="middle" class="text">백그라운드 실행</text>
  <text x="520" y="344" text-anchor="middle" class="small">자체 클라우드 컴퓨터·앱</text>
  <path d="M645 324 H730" class="arrow"/>
  <rect x="730" y="280" width="250" height="88" rx="12" class="green"/>
  <text x="855" y="316" text-anchor="middle" class="text">관찰·다음 단계 판단</text>
  <text x="855" y="344" text-anchor="middle" class="small">대화가 끝나도 계속</text>

  <path d="M855 368 V400 H520 V372" class="arrowg"/>
  <text x="688" y="422" text-anchor="middle" class="loop">목표를 달성할 때까지 반복</text>

  <path d="M980 324 H1050" class="arrow"/>
  <rect x="1050" y="280" width="110" height="88" rx="12" class="amber"/>
  <text x="1105" y="316" text-anchor="middle" class="text">승인</text>
  <text x="1105" y="344" text-anchor="middle" class="small">필요할 때만</text>
</svg>
