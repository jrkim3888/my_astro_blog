<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">dots의 권한 제어 구조</title>
  <desc id="desc">dot이 수행하려는 작업은 사용자가 정한 규칙과 자동 검토를 거쳐 허용, 승인 필요, 차단 세 가지 경로로 나뉜다.</desc>
  <rect width="1200" height="470" fill="#ffffff"/>
  <style>
    .label{font:700 24px sans-serif;fill:#171717}
    .text{font:20px sans-serif;fill:#303846}
    .small{font:17px sans-serif;fill:#667085}
    .box{fill:#f6f8fc;stroke:#d8dee9;stroke-width:2}
    .blue{fill:#eaf1ff;stroke:#2f6fed;stroke-width:2}
    .green{fill:#ecf8f0;stroke:#4a9b67;stroke-width:2}
    .amber{fill:#fdf4e7;stroke:#d79a3c;stroke-width:2}
    .red{fill:#fdeeee;stroke:#c0504d;stroke-width:2}
    .arrow{stroke:#8b97a8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .line{stroke:#8b97a8;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b97a8"/></marker>
  </defs>

  <rect x="50" y="185" width="215" height="100" rx="12" class="box"/>
  <text x="157" y="225" text-anchor="middle" class="text">dot이 하려는 작업</text>
  <text x="157" y="256" text-anchor="middle" class="small">메일 발송·PR 생성 등</text>

  <path d="M265 235 H345" class="arrow"/>

  <rect x="345" y="170" width="215" height="130" rx="12" class="blue"/>
  <text x="452" y="212" text-anchor="middle" class="text">자동 검토</text>
  <text x="452" y="243" text-anchor="middle" class="small">사용자 지시 + 규칙</text>
  <text x="452" y="270" text-anchor="middle" class="small">+ 안전 요구사항 대조</text>

  <path d="M560 235 H640" class="line"/>
  <path d="M640 235 V75" class="line"/>
  <path d="M640 235 V395" class="line"/>
  <path d="M640 75 H700" class="arrow"/>
  <path d="M640 235 H700" class="arrow"/>
  <path d="M640 395 H700" class="arrow"/>

  <rect x="700" y="30" width="450" height="90" rx="12" class="green"/>
  <text x="730" y="68" class="label">허용</text>
  <text x="810" y="67" class="small">문서 읽기 · 이슈 추적기 확인 · 내부 초안 작성</text>
  <text x="730" y="98" class="small">그대로 진행하고 결과만 보고</text>

  <rect x="700" y="190" width="450" height="90" rx="12" class="amber"/>
  <text x="730" y="228" class="label">승인 필요</text>
  <text x="838" y="227" class="small">외부 메일 발송 · 콘텐츠 발행 · 운영 PR</text>
  <text x="730" y="258" class="small">사용자가 확인할 때까지 대기</text>

  <rect x="700" y="350" width="450" height="90" rx="12" class="red"/>
  <text x="730" y="388" class="label">차단</text>
  <text x="792" y="387" class="small">운영 데이터 삭제 · 보안 설정 변경</text>
  <text x="730" y="418" class="small">규칙으로 열 수 없는 영역도 존재</text>
</svg>
